# ─────────────────────────────────────────────────────────────────────────────
# Architecture de production locale : Django (gunicorn + whitenoise) + PostgreSQL 16
#
# Démarrage (depuis ce dossier) :
#   docker compose up -d --build
#   docker compose run --rm migrate
#   docker compose up -d          # relance web (ou web redémarre automatiquement)
#   http://localhost:8000
#
# Variables interpolées depuis le `.env` du dossier (déjà présent) ; tout est
# surchargeable par l'environnement du shell (prod / CI).
# ─────────────────────────────────────────────────────────────────────────────
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-finder_ai}
      POSTGRES_USER: ${POSTGRES_USER:-finder_ai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-finder_ai}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-finder_ai} -d ${POSTGRES_DB:-finder_ai}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - finder_ai

  # Migration unique de schéma (job one-shot, exécuté dans un conteneur
  # éphémère) : le service web ne lance PAS migrate — anti-pattern en cloud
  # multi-instances (course aux migrations).
  migrate:
    build:
      context: .
    image: finder-ai:latest
    command: ["python", "manage.py", "migrate", "--noinput"]
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      SECRET_KEY: "${SECRET_KEY:?SECRET_KEY manquante - définissez-la dans le .env}"
      ALLOWED_HOSTS: localhost
      DATABASE_URL: postgres://${POSTGRES_USER:-finder_ai}:${POSTGRES_PASSWORD:-finder_ai}@db:5432/${POSTGRES_DB:-finder_ai}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      GEMINI_SERVER_API_KEY: ${GEMINI_SERVER_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - finder_ai

  web:
    build:
      context: .
    image: finder-ai:latest
    restart: unless-stopped
    environment:
      # Django
      ENVIRONMENT: production
      DEBUG: "false"
      SECRET_KEY: "${SECRET_KEY:?SECRET_KEY manquante - définissez-la dans le .env}"
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-}
      # PostgreSQL (service `db` du réseau compose)
      DATABASE_URL: postgres://${POSTGRES_USER:-finder_ai}:${POSTGRES_PASSWORD:-finder_ai}@db:5432/${POSTGRES_DB:-finder_ai}
      # Sécurité / HTTPS — désactivés en local (à activer derrière un LB/TLS)
      SECURE_SSL_REDIRECT: "false"
      SESSION_COOKIE_SECURE: "false"
      CSRF_COOKIE_SECURE: "false"
      SECURE_HSTS_SECONDS: "0"
      # Rate-limiting d'authentification (forcé par l'app dès ENVIRONMENT=production)
      AXES_ENABLED: "true"
      AXES_FAILURE_LIMIT: ${AXES_FAILURE_LIMIT:-5}
      AXES_COOLOFF_TIME: ${AXES_COOLOFF_TIME:-2}
      # APIs externes
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      GEMINI_SERVER_API_KEY: ${GEMINI_SERVER_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.0-flash}
      # Messagerie (vide ⇒ backend console, e-mails dans les logs)
      EMAIL_HOST: ${EMAIL_HOST:-}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-true}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-Finder AI <noreply@finder-ai.local>}
      # Planificateur de scraping — si SCRAPER_ENABLED=true, limiter
      # WEB_CONCURRENCY à 1 (évite la duplication des tâches APScheduler)
      SCRAPER_ENABLED: ${SCRAPER_ENABLED:-false}
      SCRAPER_TARGET_URL: ${SCRAPER_TARGET_URL:-https://github.com/trending}
      # Gunicorn / Cloud Run
      PORT: ${PORT:-8000}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
    command: >
      sh -c "python manage.py collectstatic --noinput &&
             exec gunicorn config.wsgi:application
               --bind 0.0.0.0:${PORT:-8000}
               --workers ${WEB_CONCURRENCY:-2}
               --threads 4
               --timeout 30
               --max-requests 1000
               --max-requests-jitter 100
               --access-logfile - --error-logfile -"
    ports:
      - "${WEB_PORT:-8000}:${PORT:-8000}"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:${PORT:-8000}/', timeout=5).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - finder_ai

volumes:
  postgres_data:

networks:
  finder_ai:
