{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nouveau mot de passe — Finder AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:wght@600;700&display=swap" rel="stylesheet">
  <style>
    body {
      display: flex; align-items: center; justify-content: center; min-height: 100vh;
      background: #16120d; color: #f2ece3; font-family: 'Inter', system-ui, sans-serif; padding: 20px;
    }
    .reset-card {
      width: min(420px, 100%); background: #1e1a14;
      border: 1px solid rgba(255,255,255,0.10); border-radius: 20px;
      padding: 36px 30px; box-shadow: 0 12px 40px rgba(0,0,0,0.6);
      text-align: center;
    }
    .reset-logo {
      width: 44px; height: 44px; background: linear-gradient(135deg, #e8a44a, #c8782a);
      border-radius: 12px; display: flex; align-items: center; justify-content: center;
      font-size: 20px; font-weight: 700; color: #1a1208; margin: 0 auto 16px;
    }
    .reset-card h2 { font-family: 'Source Serif 4', serif; font-size: 24px; font-weight: 600; color: #f2ece3; margin-bottom: 8px; }
    .reset-card p { font-size: 13.5px; color: #9a8e80; margin-bottom: 24px; line-height: 1.5; }
    .reset-form { display: flex; flex-direction: column; gap: 16px; text-align: left; }
    .reset-form label { font-size: 12.5px; font-weight: 600; color: #cdc4b8; display: block; margin-bottom: 6px; }
    .reset-form input {
      width: 100%; padding: 12px 14px; background: #26211a; border: 1px solid rgba(255,255,255,0.12);
      border-radius: 10px; color: #f2ece3; font-size: 14px; outline: none; transition: border-color 0.18s;
    }
    .reset-form input:focus { border-color: #e8a44a; box-shadow: 0 0 0 3px rgba(232,164,74,0.15); }
    .reset-btn {
      width: 100%; padding: 13px; background: linear-gradient(135deg, #e8a44a, #c8782a);
      color: #1a1208; border-radius: 10px; font-size: 14px; font-weight: 700; border: none;
      margin-top: 4px; transition: transform 0.18s, box-shadow 0.18s;
      box-shadow: 0 4px 16px rgba(232,164,74,0.25);
    }
    .reset-btn:hover { transform: translateY(-1px); box-shadow: 0 8px 24px rgba(232,164,74,0.4); }
    .reset-footer { margin-top: 24px; font-size: 13px; }
    .reset-footer a { color: #e8a44a; text-decoration: none; font-weight: 600; }
    .reset-footer a:hover { color: #f0b560; }
  </style>
</head>
<body>
  <div class="reset-card">
    <div class="reset-logo">🔒</div>
    <h2>Nouveau mot de passe</h2>
    <p>Saisissez votre nouveau mot de passe ci-dessous.</p>

    {% if validlink %}
    <form method="post" class="reset-form">
      {% csrf_token %}
      <div>
        <label for="id_new_password1">Nouveau mot de passe</label>
        <input type="password" name="new_password1" id="id_new_password1" required autofocus>
      </div>
      <div>
        <label for="id_new_password2">Confirmation du mot de passe</label>
        <input type="password" name="new_password2" id="id_new_password2" required>
      </div>
      <button type="submit" class="reset-btn">Changer mon mot de passe</button>
    </form>
    {% else %}
    <div style="padding: 12px; border-radius: 10px; font-size: 13.5px; background: rgba(224,97,75,0.1); border: 1px solid rgba(224,97,75,0.3); color: #e0614b; margin-bottom: 20px;">
      Ce lien de réinitialisation est invalide ou a expiré.
    </div>
    <div class="reset-footer">
      <a href="{% url 'password_reset' %}">Demander un nouveau lien</a>
    </div>
    {% endif %}
  </div>
</body>
</html>
