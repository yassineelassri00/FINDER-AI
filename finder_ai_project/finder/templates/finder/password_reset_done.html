{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>E-mail envoyé — Finder AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:wght@600;700&display=swap" rel="stylesheet">
  <style>
    body {
      display: flex; align-items: center; justify-content: center; min-height: 100vh;
      background: #16120d; color: #f2ece3; font-family: 'Inter', system-ui, sans-serif; padding: 20px;
    }
    .reset-card {
      width: min(420px, 100%); background: #1e1a14;
      border: 1px solid rgba(255,255,255,0.10); border-radius: 20px;
      padding: 36px 30px; box-shadow: 0 12px 40px rgba(0,0,0,0.6);
      text-align: center;
    }
    .reset-logo {
      width: 44px; height: 44px; background: rgba(106,191,133,0.15);
      border: 1px solid rgba(106,191,133,0.3); border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px; font-weight: 700; color: #6abf85; margin: 0 auto 16px;
    }
    .reset-card h2 { font-family: 'Source Serif 4', serif; font-size: 22px; font-weight: 600; color: #f2ece3; margin-bottom: 8px; }
    .reset-card p { font-size: 13.5px; color: #9a8e80; margin-bottom: 24px; line-height: 1.6; }
    .reset-btn {
      display: inline-block; width: 100%; padding: 12px; background: linear-gradient(135deg, #e8a44a, #c8782a);
      color: #1a1208; border-radius: 10px; font-size: 14px; font-weight: 700; text-decoration: none;
      transition: transform 0.18s, box-shadow 0.18s; box-shadow: 0 4px 16px rgba(232,164,74,0.25);
    }
    .reset-btn:hover { transform: translateY(-1px); box-shadow: 0 8px 24px rgba(232,164,74,0.4); }
  </style>
</head>
<body>
  <div class="reset-card">
    <div class="reset-logo">✓</div>
    <h2>E-mail envoyé avec succès</h2>
    <p>Si un compte existe avec cette adresse, nous vous avons envoyé un e-mail contenant les instructions pour réinitialiser votre mot de passe.</p>
    <a href="{% url 'landing' %}" class="reset-btn">Retour à la connexion</a>
  </div>
</body>
</html>
