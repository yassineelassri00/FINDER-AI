<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Erreur serveur — Finder AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Source+Serif+4:wght@600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #16120d;
      color: #f2ece3;
      font-family: 'Inter', system-ui, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 2rem;
    }
    .card {
      background: #1e1a14;
      border: 1px solid rgba(255,255,255,0.10);
      border-radius: 1.5rem;
      padding: 3.5rem 2.5rem;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 12px 40px rgba(0,0,0,0.6);
    }
    .code { font-size: 5.5rem; font-weight: 800; color: #e0614b; line-height: 1; font-family: 'Source Serif 4', serif; }
    h1 { font-family: 'Source Serif 4', serif; font-size: 1.6rem; margin: 1.2rem 0 0.5rem; color: #f2ece3; }
    p { color: #9a8e80; line-height: 1.6; font-size: 0.95rem; }
    a {
      display: inline-block;
      margin-top: 2rem;
      padding: 0.85rem 2.2rem;
      background: linear-gradient(135deg, #e8a44a, #c8782a);
      color: #1a1208;
      border-radius: 0.75rem;
      text-decoration: none;
      font-weight: 700;
      transition: transform 0.2s, box-shadow 0.2s;
      box-shadow: 0 4px 16px rgba(232,164,74,0.25);
    }
    a:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(232,164,74,0.4); }
  </style>
</head>
<body>
  <div class="card">
    <div class="code">500</div>
    <h1>Erreur serveur</h1>
    <p>Une erreur inattendue est survenue. Nos équipes ont été notifiées.</p>
    <a href="/">Retour à l'accueil</a>
  </div>
</body>
</html>
